<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="रुग्ण रांग व्यवस्थापन">
  <rect width="64" height="64" rx="14" fill="#0f766e" />
  <!-- Token slip, centred: the one thing a patient walks away holding. -->
  <rect x="17" y="13" width="30" height="38" rx="5" fill="#ffffff" />
  <rect x="22" y="20" width="20" height="4" rx="2" fill="#0f766e" />
  <rect x="22" y="28" width="20" height="4" rx="2" fill="#99f6e4" />
  <rect x="22" y="36" width="12" height="4" rx="2" fill="#99f6e4" />
  <!-- Marathi numeral १, so the icon reads as "number one" at a glance. -->
  <rect x="36" y="44" width="4" height="3" rx="1.5" fill="#0f766e" />
</svg>
